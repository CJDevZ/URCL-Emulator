<!DOCTYPE html>
<html>
	<head>
		<title>DLang Compiler</title>
		<link rel="stylesheet" href="../static/dlang/style.css">
		<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.6/ace.js" charset="utf-8"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.3/ext-language_tools.min.js"></script>
	</head>
	<body>
		<div class="main-layout">
			<div class="editor-container" id="editor">// some comment
/* 'nother comment
yes
*/
</div>

			<div class="console-container">
				<div class="console-header">Terminal / Output</div>
				<div id="console-output" class="console-body">Ready...</div>
			</div>

			<div class="controls">
				<button onclick="uploadCode()">Compile & Upload</button>
				<button onclick="saveCode()">Save</button>
				<input type="file" id="fileLoader" style="display: none;" accept=".dlang,.txt">
				<button onclick="loadCode()">Load From File</button>
			</div>
		</div>
		<script src="/static/dlang/script.js"></script>
		<script src="/static/dlang/ace.js"></script>
	</body>
</html>
